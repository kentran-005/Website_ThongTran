<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MyWebsite</title>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="assets/login.css">
</head>
<body>
    <div class="admin-login-wrapper">
        <div class="admin-login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="admin-icon">👨‍💼</div>
                    <h1>Admin Panel</h1>
                    <p>Đăng nhập để quản trị hệ thống</p>
                </div>

                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="adminUsername">
                            <span class="icon">👤</span>
                            Tên đăng nhập Admin
                        </label>
                        <input type="text" id="adminUsername" name="username" required 
                               placeholder="Nhập tên đăng nhập admin">
                    </div>

                    <div class="form-group">
                        <label for="adminPassword">
                            <span class="icon">🔒</span>
                            Mật khẩu
                        </label>
                        <input type="password" id="adminPassword" name="password" required 
                               placeholder="Nhập mật khẩu">
                    </div>

                    <div class="form-group remember-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="remember">
                            <span>Ghi nhớ đăng nhập</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-admin-login">
                        Đăng Nhập
                    </button>
                </form>

                <div class="login-footer">
                    <a href="../index.html" class="back-link">← Quay lại trang chủ</a>
                </div>
            </div>

            <div class="admin-info">
                <h3>Thông Tin Đăng Nhập Demo</h3>
                <p><strong>Username:</strong> admin</p>
                <p><strong>Password:</strong> admin123</p>
            </div>
        </div>

        <div class="admin-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
    </div>

    <script>
        const adminLoginForm = document.getElementById('adminLoginForm');
        
        adminLoginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            
            // Demo authentication login, này tĩnh thôi nha thầy, nice day!
            if (username === 'admin' && password === 'admin123') {
                alert('Đăng nhập thành công!');
                window.location.href = 'addStudent.html';
            } else {
                alert('Tên đăng nhập hoặc mật khẩu không đúng!');
            }
        });
    </script>
</body>
</html>
